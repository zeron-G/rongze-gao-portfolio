name: Read deployment diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deployment-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
  checks: read
jobs:
  explain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read the existing failed publish check (no settings writes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          url = 'https://api.github.com/repos/zeron-G/rongze-gao-portfolio/check-runs/103354788013/annotations'
          request = urllib.request.Request(url, headers={
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'X-GitHub-Api-Version': '2022-11-28',
          })
          with urllib.request.urlopen(request, timeout=20) as response:
              annotations = json.load(response)
          for annotation in annotations:
              print(json.dumps({key: annotation.get(key) for key in ['annotation_level', 'title', 'message']}, ensure_ascii=False))
          if not annotations:
              print('No annotations were returned.')
          PY
