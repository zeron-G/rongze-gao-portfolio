name: Aircraft refinement acceptance
on:
  push:
    branches: ['design/flight-refinement-2026-09-12']
    paths: ['src/flightlog/**', '.review/**', 'tests/refinement.browser.mjs', '.github/workflows/flight-refinement.yml']
permissions:
  contents: write
concurrency:
  group: aircraft-refinement
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_BASE: /
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/flight-refinement-2026-09-12
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Integrate the reviewed change without rewriting personal content
        run: |
          if ! grep -q "from './motion.js'" src/flightlog/main.js; then python .review/apply-motion.py; fi
      - run: npm ci
      - name: Check syntax and existing content contracts
        run: |
          node --check src/flightlog/main.js
          node --check src/flightlog/scene.js
          node --check src/flightlog/motion.js
          node --test tests/observatory.test.mjs
      - run: npm run build
      - name: Install isolated browser review tools
        run: |
          npm install --prefix "$RUNNER_TEMP/review-tools" --no-save --package-lock=false playwright
          node "$RUNNER_TEMP/review-tools/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/review-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Review actual WebGL output and motion behavior
        run: node tests/refinement.browser.mjs
      - name: Export source, build and review images
        if: always()
        run: |
          mkdir -p /tmp/refinement/build /tmp/refinement/source
          cp -r dist/. /tmp/refinement/build/
          cp src/flightlog/main.js src/flightlog/scene.js src/flightlog/motion.js src/flightlog/style.css /tmp/refinement/source/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aircraft-Refinement-Review
          path: /tmp/refinement
          retention-days: 7
      - name: Commit verified integration to the review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/flightlog/main.js src/flightlog/style.css
          if ! git diff --cached --quiet; then
            git commit -m 'feat: integrate verified aircraft and motion refinement [skip ci]'
            git push origin HEAD:design/flight-refinement-2026-09-12
          fi
          git log -1 --format=%H
          git ls-files -s src/flightlog/ tests/refinement.browser.mjs
