name: Flight log - build and browser review
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-build-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SITE_BASE: /
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax and content contracts
        run: |
          node --check src/flightlog/main.js
          node --check src/flightlog/scene.js
          node --check src/flightlog/motion.js
          node --test tests/observatory.test.mjs
      - run: npm run build
      - name: Install browser tooling outside the application dependency tree
        run: |
          npm install --prefix "$RUNNER_TEMP/flight-tools" --no-save --package-lock=false playwright
          node "$RUNNER_TEMP/flight-tools/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/flight-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Check the actual WebGL experience, fallback contracts and motion
        run: node tests/refinement.browser.mjs
      - name: Confirm the application lockfile was not changed by test tooling
        run: git diff --exit-code -- package.json package-lock.json
      - name: Preserve the tested Cloudflare build, screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flight-Refined-Cloudflare
          path: dist
          retention-days: 14
      - name: Deploy the verified build to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=rongzegao --branch=main
      - name: Explain why deployment was skipped
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo 'Build and browser checks passed, but Cloudflare deployment was skipped.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
