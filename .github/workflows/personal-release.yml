name: Flight log - build and browser review
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-build-review
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_BASE: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Syntax and content contracts
        run: |
          node --check src/flightlog/main.js
          node --check src/flightlog/scene.js
          node --test tests/observatory.test.mjs
      - run: npm run build
      - name: Install browser tooling outside the application dependency tree
        run: |
          npm install --prefix "$RUNNER_TEMP/flight-tools" --no-save --package-lock=false playwright
          node "$RUNNER_TEMP/flight-tools/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/flight-tools/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Check the actual built bilingual experience
        run: node tests/flightlog.browser.mjs
      - name: Confirm the app lockfile was not changed by test tooling
        run: git diff --exit-code -- package.json package-lock.json
      - name: Preserve the root-domain build, screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Off-The-Ground-Cloudflare
          path: dist
          retention-days: 14
# rongzegao.com is a Cloudflare Pages project. This workflow intentionally
# prepares its tested root build; it neither changes DNS nor retries the
# unrelated, environment-protected GitHub Pages production deployment.
